# Nginx configuration for Society Management System
# Server: www.punitdevops.shop
# Place this file at: /etc/nginx/sites-available/punitdevops.shop
# Enable with: ln -s /etc/nginx/sites-available/punitdevops.shop /etc/nginx/sites-enabled/
# Test with:   nginx -t
# Reload with: systemctl reload nginx

# ─── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name punitdevops.shop www.punitdevops.shop;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://www.punitdevops.shop$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name punitdevops.shop www.punitdevops.shop;

    # ── SSL certificates (Let's Encrypt / Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/www.punitdevops.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.punitdevops.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"      always;

    # ── Serve React frontend static build ─────────────────────────────────────
    # After running `npm run build` in client/, copy dist/ to /var/www/society-client/
    root /var/www/society-client;
    index index.html;

    # React Router: serve index.html for all non-file routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Socket.IO WebSocket proxy ──────────────────────────────────────────────
    # CRITICAL: This block MUST come before the /api/ block.
    # It enables the HTTP → WebSocket upgrade that Socket.IO requires.
    # Without these headers, Nginx strips the Upgrade header and WebSocket fails.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:9007;

        # Required for WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Standard proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering — required for real-time events
        proxy_buffering    off;

        # Increase timeouts so long-polling connections aren't killed
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 60s;
    }

    # ── REST API proxy ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:9007;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow cookies / credentials
        proxy_set_header   Cookie $http_cookie;

        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # ── Static file uploads served from backend /public ────────────────────────
    location /public/ {
        proxy_pass         http://127.0.0.1:9007;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            7d;
        add_header Cache-Control "public";
    }
}
